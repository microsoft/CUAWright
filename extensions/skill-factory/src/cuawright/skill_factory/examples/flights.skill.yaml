# The example spec — the whole loop as a file you can read, edit and re-run:
#   python -m cuawright.skill_factory build flights.skill.yaml --library ./library --jobs 3
#
# Task chosen on purpose: a flight SCHEDULE is a fact the page states plainly, it doesn't move on
# its own, and it reads the same on your machine as on ours. That is what lets `verify: strict`
# mean something. The fare on the same page would fail all three.
#
# NOTE ON THE DATE: it is fixed here so the run is reproducible, and it will go stale — once
# 2026-08-15 is in the past, Google Flights cannot show it and the solves will fail. Move it to
# any near-future date; nothing else needs to change.

task: What is the earliest nonstop flight from {origin} to {destination} on {date} (one-way)? Return the answer as a list, [flight_number, airline, departure_time], e.g. ["AS 336", "Alaska", "6:00 AM"].
start_url: https://www.google.com/flights

instances:
  - {origin: "Seattle (SEA)",       destination: "New York (JFK)", date: "2026-08-15"}
  - {origin: "San Francisco (SFO)", destination: "Boston (BOS)",   date: "2026-08-15"}
  - {origin: "Los Angeles (LAX)",   destination: "Chicago (ORD)",  date: "2026-08-15"}

build:
  # a schedule holds still, so the distilled skill must reproduce the recorded answers exactly
  verify: strict
  draws: 2             # independent distillation attempts — a draw can just come out brittle
  verify_rounds: 2     # repair rounds within one attempt
  on_fail: reference   # reference = keep a readable prior if replay fails | reject = executable or nothing
