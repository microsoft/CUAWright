[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuawright"
version = "0.2.0"
description = "CUAWright: terminal-driven browser and desktop agents"
requires-python = ">=3.10"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
    "playwright>=1.45",
    "python-dotenv>=1.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
skill-factory = ["cuawright-skill-factory==0.2.0"]
desktop = ["openai>=2.0,<3; python_version >= '3.12'"]
test = ["pytest>=8", "black==25.1.0"]
build = ["build>=1", "wheel"]

[project.scripts]
cuawright = "cuawright.run.cli:main"
cuawright-web = "cuawright.run.browser:app"
cuawright-desktop = "cuawright.run.desktop:main"
webwright = "webwright.run.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cuawright" = ["config/*.yaml", "config/**/*.yaml", "build_provenance.json"]
"webwright" = ["config/*.yaml", "config/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests", "release/osworld/tests"]
