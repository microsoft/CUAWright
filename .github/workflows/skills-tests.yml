name: skills-tests
on:
  push:
    paths: ["extensions/skill-factory/**", "tests/skill_factory/**", "pyproject.toml"]
  pull_request:
    paths: ["extensions/skill-factory/**", "tests/skill_factory/**", "pyproject.toml"]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.12" }
      - run: pip install -e ".[skill-factory,test]" -e extensions/skill-factory
      - name: skills unit tests (LLM-free)
        run: python -m pytest -q tests/skill_factory
      - name: wrapper usage check (F6)
        run: |
          set +e
          bash extensions/skill-factory/src/cuawright/webwright/skill_factory/examples/solve_with_library.sh > /dev/null 2>&1
          [ $? -eq 1 ] && echo "usage-exit OK" || { echo "wrapper must exit 1 on missing args"; exit 1; }
