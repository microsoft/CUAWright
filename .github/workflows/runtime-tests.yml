name: runtime-tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[desktop,skill-factory,test,build]" -e extensions/skill-factory
      - run: playwright install --with-deps chromium
      - run: pytest -q
      - run: python -m compileall -q src extensions/skill-factory/src
      - run: git diff --check
      - run: python -m build
      - run: python -m build extensions/skill-factory
      - run: python tests/packaging/check_wheels.py dist/cuawright-*.whl extensions/skill-factory/dist/*.whl
